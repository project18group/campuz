openapi: 3.0.3
info:
  title: Campuz API
  version: 1.0.0
  description: API endpoints for the Campuz backend
paths:
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/profile-setup/:
    put:
      operationId: auth_profile_setup_update
      description: |-
        PATCH /api/auth/profile-setup/

        Requires Bearer token. Sets display_name and optional avatar_url.
        Optionally redeems an AdminInvitationCode to grant can_create_hubs.
        Marks profile_setup_completed on success.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSetup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileSetup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileSetup'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSetup'
          description: ''
    patch:
      operationId: auth_profile_setup_partial_update
      description: |-
        PATCH /api/auth/profile-setup/

        Requires Bearer token. Sets display_name and optional avatar_url.
        Optionally redeems an AdminInvitationCode to grant can_create_hubs.
        Marks profile_setup_completed on success.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileSetup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileSetup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileSetup'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSetup'
          description: ''
  /api/auth/request-otp/:
    post:
      operationId: auth_request_otp_create
      description: |-
        POST /api/auth/request-otp/

        Body: {"phone_number": "+233...", "full_name": "Jane Doe"}

        Triggers Arkesel OTP generation and SMS delivery. A 60-second resend
        cooldown is enforced.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: |-
        POST /api/auth/verify-otp/

        Body: {"phone_number": "+233...", "otp_code": "123456"}

        Verifies OTP against Arkesel's stored value. On success: clears OTP,
        issues JWT pair, returns is_new_user flag.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/broadcasts/:
    get:
      operationId: broadcasts_list
      tags:
      - broadcasts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Broadcast'
          description: ''
  /api/broadcasts/{id}/:
    get:
      operationId: broadcasts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this broadcast.
        required: true
      tags:
      - broadcasts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
          description: ''
  /api/conversations/direct/:
    get:
      operationId: conversations_direct_retrieve
      description: |-
        POST /api/conversations/direct/
        Body: {"user_id": <int>}

        Returns an existing DirectConversation between the requester and
        user_id, or creates one.  Always returns 200 + conversation data.
        The `created` flag indicates whether a new conversation was made.

        GET /api/conversations/direct/
        Lists all direct conversations for the current user.
      tags:
      - conversations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: conversations_direct_create
      description: |-
        POST /api/conversations/direct/
        Body: {"user_id": <int>}

        Returns an existing DirectConversation between the requester and
        user_id, or creates one.  Always returns 200 + conversation data.
        The `created` flag indicates whether a new conversation was made.

        GET /api/conversations/direct/
        Lists all direct conversations for the current user.
      tags:
      - conversations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
