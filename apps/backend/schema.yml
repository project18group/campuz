components:
  schemas:
    AppNotification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        body:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - title
    Broadcast:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hub:
          type: integer
          readOnly: true
        sender:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        is_mine:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        timestamp:
          type: string
          format: date-time
          readOnly: true
        sms_delivery_count:
          type: string
          readOnly: true
        sms_sent_count:
          type: string
          readOnly: true
        sms_failed_count:
          type: string
          readOnly: true
      required:
      - content
      - hub
      - id
      - is_mine
      - sender
      - sender_name
      - sms_delivery_count
      - sms_failed_count
      - sms_sent_count
      - timestamp
      - title
    CampuzUser:
      type: object
      description: |-
        Minimal read-only representation of a registered Campuz user for
        the contact-discovery and direct-conversation features.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        can_create_hubs:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - can_create_hubs
      - display_name
      - full_name
      - id
      - is_verified
      - phone_number
    Hub:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        cover_image_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        cover_image_file:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/HubMember'
          readOnly: true
        members_count:
          type: string
          readOnly: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/HubSection'
          readOnly: true
        current_user_role:
          type: string
          readOnly: true
        can_manage_members:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - can_manage_members
      - created_at
      - creator
      - current_user_role
      - id
      - members
      - members_count
      - name
      - sections
    HubMeeting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hub:
          type: integer
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        is_mine:
          type: string
          readOnly: true
        can_manage:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        meeting_url:
          type: string
          format: uri
          maxLength: 1000
        scheduled_for:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_upcoming:
          type: string
          readOnly: true
      required:
      - can_manage
      - created_at
      - created_by
      - created_by_name
      - hub
      - id
      - is_mine
      - is_upcoming
      - meeting_url
      - scheduled_for
      - title
      - updated_at
    HubMember:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
